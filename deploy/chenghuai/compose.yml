name: chenghuai-gateway

services:
  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:v1.0.0-rc.23}
    restart: unless-stopped
    command: ["--log-dir", "/data/logs"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /data/new-api.db
      SESSION_SECRET: ${SESSION_SECRET:?Run ./start.sh to generate .env first}
      MEMORY_CACHE_ENABLED: "true"
      SESSION_COOKIE_SECURE: "false"
      TRUSTED_PROXIES: none
      NODE_NAME: chenghuai-gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 130s
